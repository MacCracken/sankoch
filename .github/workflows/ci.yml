name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -oP '(?<=^cyrius = ")[^"]+' cyrius.cyml)}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sLO "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          tar xzf "cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib/" 2>/dev/null || true
          # cycc_aarch64 (renamed from cc5_aarch64 in Cyrius 6.0) may
          # ship under bin/ (picked up by the bin/* copy above) or at
          # the tarball top-level depending on the release. Cover both.
          # Same workaround yukti and sakshi carry.
          [ -f "$CYRIUS_DIR/cycc_aarch64" ] && cp "$CYRIUS_DIR/cycc_aarch64" "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"
          chmod +x "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"* 2>/dev/null || true
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/bin"
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" "$HOME/.cyrius/lib"
          echo "$CYRIUS_VERSION" > "$HOME/.cyrius/current"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Resolve dependencies
        # Stdlib-only (zero git deps), so no cyrius.lock is committed
        # and `cyrius deps --verify` has nothing to check against. The
        # stdlib itself is pinned by the cyrius = "6.0.1" toolchain line
        # in cyrius.cyml — every CI run pulls the same stdlib snapshot.
        run: cyrius deps

      - name: Lint
        # Auto-discover so new modules are covered without editing CI.
        # Treat any warning as a failure (fail on any cyrlint "  warn " line).
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr tests/tcyr/*.tcyr tests/bcyr/*.bcyr fuzz/*.fcyr; do
            out=$(cyrius lint "$f" 2>&1)
            echo "$out"
            if echo "$out" | grep -qE '^\s*warn '; then
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Format check
        # `cyrius fmt <file>` (no flag) prints the formatted source to
        # stdout; diff against the committed file to enforce no drift.
        # Pre-2.2.4 this used `--check` but cyrius's `--check` mode is
        # exit-code-only and emits no stdout, so the diff always fired
        # spuriously — bumped to canonical invocation at 2.2.4 ship.
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr tests/tcyr/*.tcyr tests/bcyr/*.bcyr fuzz/*.fcyr; do
            if ! diff -q <(cyrius fmt "$f" 2>/dev/null) "$f" > /dev/null; then
              echo "needs fmt: $f"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Vet
        run: cyrius vet src/lib.cyr

      - name: Verify dist bundles are in sync with src/
        # `cyrius distlib` reads [lib.modules] from cyrius.cyml and
        # concatenates the listed files into dist/sankoch.cyr.
        # `cyrius distlib core` builds the kernel-safe profile
        # (types + xxhash32 + lz4_decode → dist/sankoch-core.cyr).
        # CI regenerates both and fails if either drifts from committed.
        run: |
          cyrius distlib
          cyrius distlib core
          fail=0
          for bundle in dist/sankoch.cyr dist/sankoch-core.cyr; do
            if ! git diff --quiet "$bundle"; then
              echo "ERROR: $bundle is stale. Run 'cyrius distlib [core]' and commit the result."
              git --no-pager diff "$bundle" | head -40
              fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1
          echo "dist bundles match src/"

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/lib.cyr build/sankoch
          echo "sankoch: $(wc -c < build/sankoch) bytes"

      - name: Verify ELF
        # Catch a degenerate codegen that silently produces a non-ELF.
        # 0x7F 'E' 'L' 'F' = 7f45 4c46.
        run: xxd -l 4 build/sankoch | grep -q "7f45 4c46"

      - name: Kernel-safe tripwire
        # programs/core_smoke.cyr links ONLY src/types.cyr +
        # src/xxhash32.cyr + src/lz4_decode.cyr and asserts the
        # extracted decompress + xxhash32 paths still produce correct
        # output. Non-zero exit = something alloc/syscall-using leaked
        # into the kernel-safe subset, or extraction broke a behavior.
        # Must stay green for AGNOS initrd consumption of
        # dist/sankoch-core.cyr.
        run: |
          CYRIUS_DCE=1 cyrius build programs/core_smoke.cyr build/core_smoke
          ./build/core_smoke

      - name: Cross-build aarch64
        # 2.2.2 added the aarch64 cross-build gate. sankoch's src/ is
        # syscall-free and pure-compute, so the work is verifying every
        # entry point produces a valid ARM aarch64 ELF. Stdlib syscall-
        # arity warnings ("warning:N: syscall arity mismatch") are
        # cosmetic at this stage — they come from lib/syscalls.cyr's
        # arch-divergent paths and don't fail the build.
        # Cyrius 6.0+ ships cycc_aarch64 (renamed from cc5_aarch64);
        # tarball location is covered in the install step above.
        run: |
          if [ ! -x "$HOME/.cyrius/bin/cycc_aarch64" ]; then
            echo "::error::cycc_aarch64 missing from Cyrius $CYRIUS_VERSION — aarch64 cross-build is required since 2.2.2"
            exit 1
          fi
          CYRIUS_DCE=1 cyrius build --aarch64 src/lib.cyr build/sankoch-aarch64
          CYRIUS_DCE=1 cyrius build --aarch64 programs/core_smoke.cyr build/core_smoke-aarch64
          for f in fuzz/*.fcyr; do
            name=$(basename "$f" .fcyr)
            CYRIUS_DCE=1 cyrius build --aarch64 "$f" "build/${name}-aarch64"
          done
          for bin in build/sankoch-aarch64 build/core_smoke-aarch64 build/*-aarch64; do
            [ -f "$bin" ] || continue
            file "$bin" | grep -q "ARM aarch64" || {
              echo "ERROR: $bin is not an aarch64 ELF"; file "$bin"; exit 1; }
          done
          echo "sankoch-aarch64: $(wc -c < build/sankoch-aarch64) bytes"

      - name: Test
        run: |
          cyrius test tests/tcyr/sankoch.tcyr
          cyrius test tests/tcyr/git_object.tcyr

      - name: Fuzz
        # Round-trip + malformed-input harnesses. Each one calls the
        # compress/decompress path a few hundred times with varying
        # seeds and sizes. A non-zero exit means either an assert fired
        # or the binary crashed — either way, fail the build.
        run: |
          for f in fuzz/*.fcyr; do
            name=$(basename "$f" .fcyr)
            CYRIUS_DCE=1 cyrius build "$f" "build/$name"
            timeout 60 "build/$name" || { echo "FUZZ CRASH: $name"; exit 1; }
            echo "  $name: ok"
          done

      - name: Bench
        run: cyrius bench tests/bcyr/sankoch.bcyr

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        # Matches code lines only — rejects patterns in # comments.
        # Use awk instead of "grep -v '# '" which would eat any line with
        # an inline comment and hide real hits.
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          # execve(59) / fork(57) / exec* family — compression must never
          # spawn processes. Ever.
          scan "raw execve"   'syscall( *59'
          scan "raw fork"     'syscall( *57'
          # sys_system — no shell-outs from a pure in-memory library
          scan "sys_system"   '\bsys_system\s*('
          # Compression library must not touch the filesystem from src/.
          # Tests/benches may open files; src/ must not.
          scan "sys_open"     '\bsys_open\s*('
          scan "sys_write"    '\bsys_write\s*('
          # Unbounded stack buffers (>= 64KB — force heap review)
          awk -F: '
            /var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n >= 65536) print FILENAME":"NR": large stack buffer ("n" bytes): "$0
            }' src/*.cyr | tee /tmp/bigbuf.txt
          [ -s /tmp/bigbuf.txt ] && FAIL=1
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md LICENSE cyrius.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          grep -q "$VERSION" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent (manifest pulls VERSION via \${file:VERSION})"
