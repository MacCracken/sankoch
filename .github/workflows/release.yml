name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME}"
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag ($TAG) is not semver x.y.z"; exit 1; }
          [ "$FILE_VERSION" = "$TAG" ] || {
            echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG (cyrius.cyml pulls from VERSION via \${file:VERSION})"

      - name: Install Cyrius toolchain
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -oP '(?<=^cyrius = ")[^"]+' cyrius.cyml)}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sLO "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          tar xzf "cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib/" 2>/dev/null || true
          # cc5_aarch64 packaging: pre-5.7.48 ships under bin/, 5.7.48+
          # at the tarball top-level. Cover both.
          [ -f "$CYRIUS_DIR/cc5_aarch64" ] && cp "$CYRIUS_DIR/cc5_aarch64" "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"
          chmod +x "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"* 2>/dev/null || true
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/bin"
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" "$HOME/.cyrius/lib"
          echo "$CYRIUS_VERSION" > "$HOME/.cyrius/current"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Resolve deps
        run: cyrius deps

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/lib.cyr build/sankoch
          echo "sankoch: $(wc -c < build/sankoch) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/sankoch | grep -q "7f45 4c46"

      - name: Cross-build aarch64
        # 2.2.2 made aarch64 cross-build a hard release requirement.
        # Mirror the CI gate; a release tag can't ship without an
        # aarch64 binary alongside x86_64.
        run: |
          if [ ! -x "$HOME/.cyrius/bin/cc5_aarch64" ]; then
            echo "::error::cc5_aarch64 missing from Cyrius $CYRIUS_VERSION — aarch64 cross-build is required since 2.2.2"
            exit 1
          fi
          CYRIUS_DCE=1 cyrius build --aarch64 src/lib.cyr build/sankoch-aarch64
          file build/sankoch-aarch64 | grep -q "ARM aarch64" || {
            echo "ERROR: build/sankoch-aarch64 is not an aarch64 ELF"; exit 1; }
          echo "sankoch-aarch64: $(wc -c < build/sankoch-aarch64) bytes"

      - name: Test
        run: |
          cyrius test tests/tcyr/sankoch.tcyr
          cyrius test tests/tcyr/git_object.tcyr

      - name: Fuzz
        run: |
          for f in fuzz/*.fcyr; do
            name=$(basename "$f" .fcyr)
            CYRIUS_DCE=1 cyrius build "$f" "build/$name"
            timeout 60 "build/$name" || { echo "FUZZ CRASH: $name"; exit 1; }
            echo "  $name: ok"
          done

      - name: Regenerate bundles (full + core)
        run: |
          cyrius distlib
          cyrius distlib core

      - name: Kernel-safe tripwire
        # Mirror the CI gate so a release tag can never ship a
        # broken or alloc-tainted dist/sankoch-core.cyr.
        run: |
          CYRIUS_DCE=1 cyrius build programs/core_smoke.cyr build/core_smoke
          ./build/core_smoke

      - name: Clean toolchain artifacts
        run: rm -f cyrius-*.tar.gz

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="sankoch-${TAG}/" -o "sankoch-${TAG}-src.tar.gz" HEAD
          cp dist/sankoch.cyr      "sankoch-${TAG}.cyr"
          cp dist/sankoch-core.cyr "sankoch-${TAG}-core.cyr"
          # Ship prebuilt binaries alongside source + bundles so
          # consumers can grab a statically-linked ELF per arch.
          if [ -f build/sankoch ]; then
            cp build/sankoch "sankoch-${TAG}-x86_64-linux"
          fi
          if [ -f build/sankoch-aarch64 ]; then
            cp build/sankoch-aarch64 "sankoch-${TAG}-aarch64-linux"
          fi
          sha256sum sankoch-*.tar.gz sankoch-*.cyr sankoch-*-linux 2>/dev/null > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            sankoch-*.tar.gz
            sankoch-*.cyr
            sankoch-*-linux
            SHA256SUMS

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk "/^## \\[${TAG}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md
      - uses: softprops/action-gh-release@v2
        with:
          name: "sankoch ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') }}
          files: |
            sankoch-*.tar.gz
            sankoch-*.cyr
            sankoch-*-linux
            SHA256SUMS
